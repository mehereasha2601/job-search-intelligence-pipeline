services:
  - type: web
    name: job-search-intelligence-pipeline
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEMO_MODE
        value: true
      - key: DRY_RUN
        value: true
    healthCheckPath: /health
